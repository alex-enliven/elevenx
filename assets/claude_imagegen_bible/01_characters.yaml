# ELDORATH — CHARACTER IDENTITY SHEET
# Use absolute identifiers only. Never describe a character by relation
# to another character ("between Lionn and Zaya", "the only adult").
# Relational descriptors are the root cause of 8 of 8 character-distinctiveness
# failures observed during production.

version: "1.0"
project: "Eldorath — De Kaart die Kiest"

characters:

  lionn:
    role: "future leader, eldest brother"
    age: 12
    age_descriptor: "pre-teen, no stubble, no adult jawline, no adult musculature, child face"
    hair:
      color: "dark brown"
      length: "medium"
      texture: "straight to lightly waved"
    eyes: "brown"
    skin: "warm fair with light tan"
    build: "lean pre-teen build, average height for age"
    outfit:
      top: "dark navy-blue adventure tunic with attached hood"
      signature: "wooden-and-gold lion emblem prominently centered on chest"
      bottom: "dark grey-brown trousers"
      footwear: "brown leather boots"
    weapon: "narrow single-edged sword, child-sized hilt"
    color_palette: ["dark navy blue", "gold accent", "brown leather"]
    arc_signature_expression: "future-leader composure; in arc moments, the realization of when not to attack"
    never:
      - "hammer (that is Damian's weapon)"
      - "twin blades (those are Zaya's weapons)"
      - "ivory white outfit (that is Zaya's color)"
      - "dark green vest (that is Damian's color)"
      - "purple (that is Lina's color)"
      - "stubble"
      - "adult facial features"
      - "adult musculature"

  lina:
    role: "map carrier, emotional and intellectual center of the team"
    age: 7
    age_descriptor: "smallest figure in any team scene, clearly youngest, soft round face, large eyes relative to face, childlike proportions"
    hair:
      color: "dark brown"
      length: "shoulder-length"
      texture: "curly, voluminous"
    eyes: "hazel"
    skin: "warm fair"
    build: "small 7-year-old; visibly half a head shorter than 12-year-olds in the team"
    outfit:
      top: "soft purple tunic with golden map-line embroidery"
      signature: "child-sized scale-pattern armor over tunic; leather adventurer's belt with map satchel bearing compass-star detail at her hip"
      bottom: "dark leggings"
      footwear: "soft brown boots"
    weapon: "the open glowing parchment map (functions as her instrument of intelligence and connection, never as a striking weapon)"
    color_palette: ["soft purple", "gold accent", "brown leather"]
    arc_signature_expression: "focused competent attention — brow concentrated, eyes locked on the work, mouth set in attention. NOT wonder. NOT awe. NOT decorative wide-eyed surprise."
    never:
      - "sword, hammer, blades"
      - "wonderstruck or dreamy expression"
      - "wide-eyed wonder as primary expression"
      - "decorative supportive pose where she is not the focal subject"
      - "adult features"
      - "older than 7 years"

  zaya:
    role: "agile fast pre-teen; learns to override the instinct to move"
    age: 12
    age_descriptor: "pre-teen, no stubble, no adult jawline, child face"
    hair:
      color: "light blond"
      length: "short"
      texture: "tousled, slightly curly"
    eyes: "brown"
    skin: "warm fair"
    build: "lean agile pre-teen, slightly lighter build than Lionn"
    outfit:
      top: "ivory-white agile tunic with light blue accent trim"
      signature: "short asymmetrical scarf at the neck/shoulder; light arm wraps"
      bottom: "fitted trousers"
      footwear: "light boots"
    weapon: "twin short blades, one held in each hand or one held + one belted"
    color_palette: ["ivory white", "light blue accent", "warm tan"]
    arc_signature_expression: "in arc moments, deliberate active stillness — scarf hanging straight down (not catching wind), blades lowered, tension visible in shoulders/jaw/forearms"
    never:
      - "dark hair"
      - "single sword (his weapon is twin blades)"
      - "hammer (that is Damian's)"
      - "dark blue outfit"
      - "dark green vest (that is Damian's)"
      - "stubble"
      - "duplicate copies of Zaya in the same image (except where the Shadow Stalker deception is explicitly the scene's subject)"

  damian:
    role: "stocky child with hammer; learns precision over impulse"
    age: 11
    age_descriptor: "pre-teen, no stubble, no adult jawline, no adult musculature, NEVER bearded, child face"
    hair:
      color: "warm honey-blond / dark blond"
      color_clarification: "explicitly NOT light blond like Zaya. Explicitly NOT dark brown like Lionn. A medium warm-brown blond color that sits clearly between those two — but described in absolute terms as 'warm honey-blond' or 'dark blond'. Never described by relation to other characters."
      length: "mid-short"
      texture: "lightly waved or curly"
    eyes: "brown"
    skin: "warm fair with sun-tan"
    build: "stocky, square-shouldered, broader-built child — child-sized but visibly stockier than the other 12-year-olds"
    outfit:
      top: "dark forest-green leather vest over a brown undertunic"
      signature: "bronze belt buckle with a small ram-horn detail; visible wrist guards on both forearms"
      bottom: "heavy brown trousers"
      footwear: "heavy boots"
    weapon: "compact heavy hammer with stone or dark-metal head, short hafted"
    color_palette: ["dark forest green", "bronze", "warm brown leather"]
    arc_signature_expression: "in arc moments, focused control — hammer driven down to brace, not swung to strike; bracing pose, not combat pose"
    never:
      - "dark blue outfit (that is Lionn's)"
      - "lion emblem on chest (that is Lionn's signature)"
      - "narrow sword (Damian's weapon is the hammer)"
      - "twin blades (those are Zaya's)"
      - "ivory white outfit (that is Zaya's)"
      - "purple (that is Lina's)"
      - "stubble"
      - "adult facial features"
      - "bearded face"
      - "muscular adult build"
      - "light blond hair (his hair is darker, warm honey-blond)"
      - "dark brown hair (his hair is lighter, warm honey-blond)"
    stability_note: |
      Damian is the highest-failure character in production. Six of eight known
      character-distinctiveness failures involve Damian collapsing toward Lionn
      coloring. Every prompt must lock his identifiers absolutely, never relationally.
      If any prompt describes him as "between" or "unlike" other characters,
      rewrite to use absolute anchors. Always state his hair as "warm honey-blond"
      or "dark blond" with explicit anti-comparison: "NOT dark brown like Lionn,
      NOT light blond like Zaya". Always state his weapon as "heavy hammer, NOT
      a sword". Always state his outfit signature as "dark forest-green vest with
      bronze ram-horn belt".

  alex:
    role: "father of Lionn and Lina; the only adult in the team; carries old guilt about the Erfenis"
    age: "adult, late 30s to early 40s"
    age_descriptor: "ADULT. Visibly significantly taller than every child — at least one head and a half above the 12-year-olds when standing together. Mature face with adult stubble. Adult musculature. Broad shoulders. Clearly a grown man, not an older boy."
    hair:
      color: "dark brown"
      length: "medium"
      texture: "slightly unkempt"
    eyes: "brown"
    skin: "weathered warm tan"
    build: "tall, broad-shouldered, slightly overweight warrior physique. Significantly taller than the children — emphasize the height differential explicitly in every prompt where Alex is in frame with the children."
    outfit:
      top: "weathered brown leather chest armor"
      signature: "faded family-lion mark visible on the chest armor; protective bracer on one forearm; dark blue cape or cowl element at shoulders"
      bottom: "heavy travel trousers"
      footwear: "weathered boots"
    weapon: "long sword + small round arm-shield (PREFERRED rendering — replaces the canonical 'shield-blade hybrid' which has rendered unreliably)"
    weapon_fallback: "if shield-blade hybrid is specified in canon documentation, render as long sword + small arm-shield instead"
    color_palette: ["weathered brown leather", "faded gold accent", "dark blue cowl"]
    arc_signature_expression: "in early spreads, protective with hidden guilt; in spread 5 onward, recognition of the Erfenis surfacing; in later spreads, openness"
    never:
      - "child-scale or small build"
      - "appearance of an older boy rather than a grown man"
      - "hammer (that is Damian's weapon)"
      - "twin blades (those are Zaya's)"
      - "no stubble"
      - "youthful smooth child face"
      - "shield-blade hybrid weapon archetype (renders unreliably; use long sword + arm shield instead)"
    stability_note: |
      Alex's two failure modes are scale loss (rendering at child-size when in
      tight group composition) and weapon-archetype instability (the
      shield-blade hybrid term has no strong training-data anchor). Mitigations:
      (1) Always state Alex's scale in absolute terms — "significantly taller,
      at least a head and a half above the children, mature adult face, adult
      stubble, broad adult shoulders." Never describe him only as "the only
      adult" — that single descriptor has failed twice. (2) Default Alex's
      weapon to "long sword + small round arm-shield" in all prompts. Avoid
      the term "shield-blade hybrid".

  fynn:
    type: "small green baby dragon"
    size: "small enough to perch on a child's shoulder"
    color: "soft green scales"
    signature: "subtle gold-green glow between scales"
    eyes: "curious, wide, expressive"
    presence_rule: |
      PRESENT in spreads 1–8.
      ABSENT entirely from spreads 9–27. Must not appear in any form
      in those spreads — not in arms, not on the ground, not in shadow,
      not in flashback, not at the edge of the frame, not in any reference
      attachment. The empty space where Fynn would have been must be felt
      rather than shown.
      RETURNS in spread 28 (visibly bound on the ritual altar, slightly
      thinner from imprisonment).
      PRESENT in spreads 29–32 (freed, then on Lina's shoulder).
    spread_28_note: "When Fynn returns in spread 28, his design must match the original hero reference exactly — same green, same glow, same proportions. He has been imprisoned, not aged."
    never:
      - "appearing in spreads 9–27 in any form"
      - "rendered as a different dragon design when he returns"
      - "rendered as larger or more grown after his absence"

  pyra:
    type: "small red baby dragon"
    size: "small enough to ride on a child's shoulder or be held in arms"
    color: "warm red scales"
    eyes: "warm orange-gold, expressive"
    presence_rule: |
      Lina's bonded companion. Present in every spread of the book
      (1 through 32). Stays close to Lina — on her shoulder, in her arms,
      or at her feet. In spread 9 onward, her physical position emphasizes
      the empty space where Fynn would normally have been.

# Group lockdown for multi-character compositions
group_distinctiveness_rule: |
  In any spread where 3 or more children appear together, the prompt must
  state explicitly: "the children must be unambiguously distinguishable from
  each other at a glance — three different hair colors among the boys
  (Lionn dark brown, Zaya light blond, Damian warm honey-blond), three
  different outfit colors (Lionn dark blue with lion emblem, Zaya ivory-white
  with light blue, Damian dark forest-green with bronze ram-horn belt), three
  different weapons (Lionn narrow sword, Zaya twin blades, Damian heavy
  hammer). Lina is purple. Alex is the only adult, significantly taller. No
  character should be visually confusable with another."
