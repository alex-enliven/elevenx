# ELDORATH — PER-SPREAD SPEC TEMPLATE
# Each spread is defined by one spec entry. The prompt assembler ingests
# the spec + the character identity sheet + the composition rules to
# produce a complete prompt.

version: "1.0"

schema:
  spread_number:
    type: integer
    description: "1-32"

  chapter_number:
    type: integer
    description: "1-10"

  is_chapter_opener:
    type: boolean
    description: "true if this spread starts a new chapter; affects markdown (# chapter title)"

  spread_title_dutch:
    type: string

  the_moment:
    verb:
      type: string
      description: "one verb that the spread is built around"
      examples: ["exhales", "blazes", "snatches", "kneels", "chooses", "turns_back", "misleads", "isolates", "reveals", "looms", "stops", "opens", "bound", "breaks", "returns", "anchors", "holds", "solves", "falls", "rises", "strengthens", "awakens"]
    focal_point:
      type: string
      description: "what the reader sees first; the precise visual element where the verb fires"
    eye_path:
      type: array
      description: "ordered list of what the viewer sees first, second, third, fourth"

  cast:
    in_focus:
      type: array
      description: "1-3 characters who are physically part of the moment"
      item_schema:
        character: "name from character identity sheet"
        action: "verb-driven physical description, NOT static pose"
        relationship_to_focal: "how they connect to the moment's verb"
    background_presence:
      type: array
      description: "0-3 characters in soft focus or peripheral; brief description only — do not over-detail"
      item_schema:
        character: "name from character identity sheet"
        position: "spatial position in frame"
        soft_focus: true
    off_frame:
      type: array
      description: "characters explicitly NOT in this scene; especially Fynn for spreads 9-27"
      item_schema:
        character: "name"
        reason: "narrative justification for absence"

  location:
    name:
      type: string
    phase_color:
      type: string
      description: "dominant color from the visual rhythm table"
    atmospheric_details:
      type: array
      description: "2-4 specific atmospheric details"

  lighting:
    primary_source:
      type: string
    secondary_source:
      type: string
    contrast_mechanic:
      type: string
      description: "how light frames the moment; what fights what"

  map_status:
    type: string
    description: "dormant / glowing gold / glowing turquoise / open with route to X / etc"

  emotional_focus:
    type: string
    description: "one sentence on the emotional weight of the moment"

  watch_points:
    type: array
    description: "spread-specific failure modes and surgical regenerate language"
    item_schema:
      failure: "what could go wrong in this specific spread"
      surgical_fix: "regenerate language to use if the failure occurs"

  cast_lockdown_required:
    type: boolean
    description: "true for any 4+ character action scene; triggers explicit cast distinctiveness rule in the prompt"

  thinking_mode_recommended:
    type: boolean
    description: "true for arc moments, complex composition, finale spreads"

  reference_attachments:
    type: array
    description: "which references to attach to the API call for this spread"
    options: ["hero_lineup", "villain_sheet", "spread_1_world_map", "most_recent_approved", "parchment_template (NO — composed in HTML)"]

  fynn_present:
    type: boolean
    description: "computed from spread number: true for 1-8 and 28-32, false for 9-27"

  conversation_strategy:
    type: string
    enum: ["new_conversation", "continued_conversation"]
    description: "whether this spread starts a new chapter conversation or continues an existing one"

# ============================================================================
# EXAMPLE SPECS — two filled-in spreads, one quiet (5) and one combat (16)
# ============================================================================

example_specs:

  spread_05:
    spread_number: 5
    chapter_number: 2
    is_chapter_opener: true
    spread_title_dutch: "De Vonk"

    the_moment:
      verb: "exhales"
      focal_point: "a single small red-gold magical spark hanging in mid-air just above Lina's outstretched palm"
      eye_path:
        - "the spark in mid-air (brightest, sharpest element in the frame)"
        - "Pyra's small open mouth still releasing the last wisps of light"
        - "Lina's face turned upward in quiet wonder"
        - "Alex behind her, gone pale, mouth half-open from the whisper, hand half-raised — too late"

    cast:
      in_focus:
        - character: "lina"
          action: "right palm outstretched upward, holding Pyra in left arm, watching the spark with quiet wonder"
          relationship_to_focal: "the spark hangs above her palm — she is the receiver of the moment"
        - character: "pyra"
          action: "in Lina's left arm, mouth slightly open, having just released the spark"
          relationship_to_focal: "the source of the spark"
        - character: "alex"
          action: "half a step behind Lina, mouth half-open from a whisper only Lina heard, one hand half-raised toward her — too late, his face has just gone pale"
          relationship_to_focal: "the emotional payload — recognition and old guilt rising as he sees what the spark means"

      background_presence:
        - character: "lionn"
          position: "left edge of scene, soft focus, alert but not yet registering"
          soft_focus: true
        - character: "zaya"
          position: "right edge of scene, soft focus, alert but not yet registering"
          soft_focus: true
        - character: "damian"
          position: "right edge of scene, soft focus, alert but not yet registering"
          soft_focus: true
        - character: "fynn"
          position: "perched on a fence rail to the right side of the frame, watching the spark with curiosity, faint gold-green glow"
          soft_focus: true

      off_frame:
        - character: "none"
          reason: "Spread 5 is the chapter opener for the inciting incident; entire team plus both dragons are present, but cast compression places Lionn/Zaya/Damian as background presence rather than focal"

    location:
      name: "Eldorath training yard"
      phase_color: "warm gold (Eldorath safety palette) with the first cool tint creeping in"
      atmospheric_details:
        - "wind has dropped, no birds, an unnatural held-breath quality in the air"
        - "blue heraldic banners with golden lion sigils hang motionless"
        - "morning has gone unnaturally still"

    lighting:
      primary_source: "drained morning gold (cooler than dawn)"
      secondary_source: "the spark itself — small intense red-gold pinpoint, brightest light in the frame"
      contrast_mechanic: "the spark lights Lina's face from above and her satchel from within; Alex's face is half-lit by the spark, half-shadowed by his own dread"

    map_status: "the satchel at Lina's hip glows softly from inside; the map itself is not yet visible"

    emotional_focus: "the moment a small thing wakes up something old; wonder on Lina's face, quiet recognition on Alex's"

    watch_points:
      - failure: "Alex's expression reads as generic concern rather than recognition + buried guilt"
        surgical_fix: "Alex's face must show recognition and old buried guilt rising to the surface, not generic worry — he is realizing something he hoped would never happen."
      - failure: "spark not the focal point; characters posed around it"
        surgical_fix: "The spark must be the brightest, sharpest single point of light in the entire frame — visibly hanging in mid-air just above Lina's outstretched palm with a faint warm trail behind it. Composition centers on the spark, not on the characters."

    cast_lockdown_required: false
    thinking_mode_recommended: false

    reference_attachments:
      - "hero_lineup"
      - "spread_1_world_map"
      - "most_recent_approved"

    fynn_present: true

    conversation_strategy: "continued_conversation"

  spread_16:
    spread_number: 16
    chapter_number: 5
    is_chapter_opener: false
    spread_title_dutch: "De Brug Wordt Wakker"

    the_moment:
      verb: "rises"
      focal_point: "the Bridge Guardian colossus mid-rise — partially still bridge structure, partially formed humanoid colossus, with chest-eye glowing pale blue at its core"
      eye_path:
        - "the Guardian's massive rising form (focal)"
        - "its chest-eye glowing pale-blue at its core"
        - "the team scattered across the unstable bridge surface in dynamic motion"
        - "canyon depths visible through gaps below"

    cast:
      in_focus:
        - character: "bridge_guardian"
          action: "mid-rise, partially still bridge structure, lower half merging with the bridge, upper half a rising colossus with arms and torso and head; chest-eye glowing cold pale-blue"
          relationship_to_focal: "is the focal subject"

      background_presence:
        - character: "lionn"
          position: "rolling away from a swinging stone arm"
          soft_focus: true
        - character: "zaya"
          position: "leaping clear of falling stones"
          soft_focus: true
        - character: "damian"
          position: "crouched and stabilizing in the lower foreground, hammer braced against the unstable bridge stones, weight low"
          soft_focus: true
        - character: "alex"
          position: "shielding Lina at the edge of the bridge, long sword + arm shield raised"
          soft_focus: true
        - character: "lina"
          position: "with the open glowing map raised, the gold light beginning to radiate outward"
          soft_focus: true

      off_frame:
        - character: "fynn"
          reason: "spread 9-27 absence rule; Fynn is imprisoned in the Drakentempel and does not appear"

    location:
      name: "De Kloof — the bridge mid-collapse"
      phase_color: "dust-orange dominant with cold pale-blue accent from the Guardian's chest-eye"
      atmospheric_details:
        - "dust hanging everywhere, stones realigning in mid-air"
        - "canyon depths visible through gaps where the bridge floor used to be"
        - "cool gray sky above"

    lighting:
      primary_source: "thick dust-orange haze from the canyon depths below"
      secondary_source: "harsh gray daylight from above; cold pale-blue glow from the Guardian's chest-eye; warm gold from Lina's raised map"
      contrast_mechanic: "three competing light sources framing the composition — orange below, cold blue at the center, warm gold from Lina"

    map_status: "open in Lina's hands, brilliant gold, actively guiding her"

    emotional_focus: "scale and overwhelm; the Guardian is too big, the team is too small, the bridge is breaking"

    watch_points:
      - failure: "Guardian and team look comparably sized, threat doesn't land"
        surgical_fix: "The Bridge Guardian must dwarf the team — the children should look approximately 1/15th to 1/20th its scale, like ants on a moving cathedral. The team is visibly outmatched; the Guardian's individual fingers are larger than a child."
      - failure: "Damian collapsed toward Lionn-coloring (known failure mode for combat scenes)"
        surgical_fix: "Damian has warm honey-blond hair (NOT dark brown like Lionn), dark forest-green leather vest with bronze ram-horn belt, heavy compact hammer (NOT a sword). He must be present in the lower foreground, crouched and bracing on the bridge surface."
      - failure: "Alex's shield-blade hybrid fails to render; weapon substitution"
        surgical_fix: "Alex carries a long sword with a small round arm-shield — render these as two separate items, both common archetypes, instead of a hybrid weapon."
      - failure: "duplicate character in lower foreground"
        surgical_fix: "There is only ONE Lionn in this image. Any second figure with dark hair and a sword must be replaced with Damian's canon appearance (warm honey-blond, dark green vest, hammer)."

    cast_lockdown_required: true
    thinking_mode_recommended: true

    reference_attachments:
      - "hero_lineup"
      - "villain_sheet"
      - "spread_1_world_map"
      - "most_recent_approved"

    fynn_present: false

    conversation_strategy: "new_conversation"

# ============================================================================
# MARKDOWN SCHEMA — for HTML overlay text per spread
# ============================================================================

markdown_overlay_schema:
  is_chapter_opener_true:
    pattern: |
      # [Chapter Title]

      ## [Spread Title]

      [Body paragraphs]
  is_chapter_opener_false:
    pattern: |
      ## [Spread Title]

      [Body paragraphs]

  rules:
    - "Use # for chapter title (chapter openers only)"
    - "Use ## for spread title"
    - "Body uses standard paragraphs"
    - "No inline bullets"
    - "Plain prose only — markdown structure is applied in HTML post-production"
