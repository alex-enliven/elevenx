# ELDORATH — COMPOSITION RULES AND FAILURE-MODE TAXONOMY
# These rules encode 8 known character-distinctiveness failures
# and 4 format-constraint failures observed during production.
# Every prompt assembled by Claude Code should respect these rules.

version: "1.0"

style_anchor:
  description: |
    Cinematic stylized animated fantasy, inspired by Arcane and K-pop Demon
    Hunters. Premium children's fantasy film look. Soft painterly rendering
    but sharp enough for print. Rich contrast, expressive youthful faces,
    detailed costumes, magical glow where appropriate, strong cinematic
    lighting, clean silhouettes.
  forbidden_styles:
    - "classical oil painting"
    - "watercolor"
    - "flat children's-book cartoon"
    - "photorealism"
    - "sketch / storyboard style"
    - "muddy faces"
    - "inconsistent costumes"
    - "generic fantasy outfits"

format_invariants:
  description: |
    These four invariants must appear verbatim in every prompt AND every
    surgical regenerate. Conversation memory is unreliable for hard format
    constraints. Restate every time.
  invariants:
    - rule: "A4 portrait orientation"
      ratio: "1:1.414 (taller than wide)"
      enforcement: "must hold; if model returns landscape or square, regenerate"
    - rule: "Leftmost 6% atmospheric blend zone"
      content: "only soft mist, drifting motes, soft light, faint cloak edges, wispy decorative tendrils"
      fade: "fades gently toward warm parchment-cream tones at the leftmost edge"
      enforcement: "no characters, faces, weapons, dragon bodies, or hard focal elements in this zone"
    - rule: "Leftmost 8% clear of hard focal elements"
      forbidden_in_zone:
        - "characters"
        - "weapons"
        - "body parts"
        - "drakenmagie or hard magical effects"
        - "fire"
        - "tree trunks at full detail"
      enforcement: "if any character or weapon appears in leftmost 8%, regenerate with explicit repositioning"
    - rule: "Focal point at 60–70% across portrait width"
      direction: "right of center"
      enforcement: "if focal point is centered or left-of-center, regenerate"
  layout_components_NOT_to_generate:
    description: "These elements are composed in HTML post-production, never in the AI generation"
    elements:
      - "parchment background"
      - "decorative fantasy border"
      - "corner flourishes"
      - "page-number medallion"
      - "Dutch text overlay"
      - "any text in the image"

moment_over_portrait:
  description: |
    Every spread is built around one verb-driven moment, not "the team poses
    in a setting." Hero-shot composition is rejected.
  rule: |
    Identify the verb of the spread BEFORE writing the prompt. Build the
    composition around that verb. The focal point IS the moment when the
    verb fires. Characters are described THROUGH their relationship to the
    action, not as static figures in the same space.
  prompt_structure:
    description: "Variable scene block follows MOMENT-first structure"
    blocks_in_order:
      - "[LOCATION] — one or two lines, atmospheric, not detailed. Tied to phase color."
      - "[THE MOMENT] — longest block in the prompt. Verb-driven action description with focal point explicit and eye-path stated."
      - "[CAST IN FOCUS] — 1–3 characters who are physically part of the moment, with absolute identifiers and relationship to action"
      - "[BACKGROUND PRESENCE] — 0–3 characters in soft focus or peripheral, brief description only (do not over-specify)"
      - "[OFF-FRAME] — explicitly list characters NOT in the scene, especially Fynn for spreads 9–27"
      - "[EMOTIONAL FOCUS] — one line on the emotional weight"
      - "[LIGHTING] — specific lighting cue tied to phase color and moment mood"
      - "[MAP STATUS] — if visible, current state of the map"
  rejection_criteria:
    description: "A generated spread is a hero shot (regenerate required) if ANY apply"
    criteria:
      - "characters facing the camera in a posed lineup"
      - "compositionally symmetrical and posed rather than dynamic and caught"
      - "image works as poster or t-shirt design — nothing specific is happening"
      - "the spread could be replaced by any other scene without the story changing"
      - "the 'action' is a prop (a glow, a weapon) while characters stand statically"

cast_compression:
  description: "Not every character belongs in every frame"
  rules:
    in_focus_max: 3
    background_presence_max: 3
    explicit_off_frame_required: true
  default_rejection: |
    The default tendency to put 'all 5 children + 2 dragons' in every scene
    is rejected. Each spread declares cast roles: IN_FOCUS / BACKGROUND_PRESENCE
    / OFF_FRAME. Background presence characters get only their position and
    posture, never their full canon detail (over-detailing background
    characters causes the model to weight them as compositionally equivalent
    to focal characters).

failure_modes:
  damian_collapse:
    frequency: "6 of 8 known character failures"
    description: "Damian's identifiers collapse toward Lionn's under multi-character action load"
    triggers:
      - "combat compositions with 4+ figures at similar scale"
      - "scenes where Damian and Lionn appear together in mid-action"
      - "prompts that describe Damian by relation to other characters"
    prevention_rules:
      - "Always state Damian's hair as 'warm honey-blond' or 'dark blond' — absolute term"
      - "Always anti-compare: 'NOT dark brown like Lionn, NOT light blond like Zaya'"
      - "Always state his outfit signature: 'dark forest-green leather vest with bronze ram-horn belt buckle'"
      - "Always state his weapon: 'heavy hammer, NOT a sword'"
      - "Never use relational descriptors like 'between Lionn and Zaya' or 'broader than the others'"
    surgical_regenerate_template: |
      The figure currently rendered with [dark brown hair / dark blue outfit /
      sword / Lionn-coloring] in [position] should be DAMIAN. Damian has:
      - Warm honey-blond hair (NOT dark brown like Lionn, NOT light blond like Zaya)
      - Dark forest-green leather vest with brown undertunic
      - Bronze belt with ram-horn detail on the buckle
      - Stocky square-shouldered child build
      - Heavy compact hammer (NOT a sword)
      - Pre-teen face, no stubble, no adult features
      Damian must be visually distinguishable from Lionn at a glance through
      three identifiers: hair color, outfit color, weapon. He must be present
      in this image with his canon appearance.

  alex_scale_loss:
    frequency: "2 of 8 known character failures"
    description: "Alex reduces to child-scale when in tight group composition with the children"
    triggers:
      - "tight group shots where Alex is at similar compositional weight to children"
      - "prompts that describe Alex only as 'the only adult' without absolute scale anchor"
    prevention_rules:
      - "Always describe Alex with absolute scale: 'significantly taller, at least a head and a half above the children'"
      - "Always include adult-face anchors: 'mature adult face, adult stubble, broad adult shoulders'"
      - "Never use 'the only adult' as the sole scale descriptor"
    surgical_regenerate_template: |
      Alex must be rendered as significantly taller than every child in the
      frame — at least a head and a half above the 12-year-olds. He has a
      mature adult face with adult stubble (rugged dark hair). Adult build,
      broad shoulders, slightly overweight warrior physique. Weathered brown
      leather chest armor with a faded family-lion mark. He is unambiguously
      a grown man, not an older boy. Long sword + small round arm-shield.

  weapon_swap:
    frequency: "2 of 8 known character failures"
    description: "Lionn (sword) and Damian (hammer) swap weapons in combat compositions"
    triggers:
      - "combat scenes where both Lionn and Damian are mid-action"
      - "scenes where the model has to track multiple weapon assignments"
    prevention_rules:
      - "State explicit weapon ownership in every prompt"
      - "State explicit anti-swap rule"
    surgical_regenerate_template: |
      Lionn holds a SWORD, NOT a hammer. The boy in dark blue with the lion
      emblem must be holding a narrow sword. Damian holds a HAMMER, NOT a
      sword. The broader boy in dark forest-green vest with bronze ram-horn
      belt must be holding a heavy hammer. Their canon weapons are
      non-negotiable and cannot be swapped.

  zaya_duplicates_when_damian_fails:
    frequency: "2 of 8 known character failures"
    description: "When Damian fails to render, his slot fills with a second Zaya rather than empty"
    triggers:
      - "scenes where Damian's identity collapses AND another blond child slot is needed"
    prevention_rules:
      - "Always specify exact count: 'There is exactly ONE Zaya in this image.'"
      - "Always state: 'Any second blond child must be Damian (warm honey-blond, dark green vest, hammer), not another Zaya'"
    exceptions:
      - "Spread 13 explicitly requires multiple Zayas — the Shadow Stalker deception scene. The 'Tien Zaya's' moment is intentional duplication."

  shield_blade_hybrid_fails:
    frequency: "1 of 8 known character failures"
    description: "Alex's canonical shield-blade hybrid weapon renders unreliably; the model substitutes weapons or fails the design"
    prevention_rules:
      - "Default Alex's weapon to 'long sword + small round arm-shield' in all prompts"
      - "Avoid the term 'shield-blade hybrid' entirely"
      - "If canon documentation references shield-blade hybrid, override with the long-sword-and-arm-shield rendering"

  duplicate_character:
    frequency: "intermittent across the project"
    description: "Model places the same character in multiple compositional zones (e.g. duplicate Lionn)"
    prevention_rules:
      - "Every prompt explicitly names every character once and lists which characters are NOT in a zone"
      - "Use anti-duplication language: 'Lionn is in the foreground. Lionn is NOT in the background.'"
      - "Count cast assignments before sending — does every character appear exactly once across the zones?"
    surgical_regenerate_template: |
      [Character name] must appear ONLY ONCE in this image, in [position].
      The figure in [other position] currently rendered as another [character]
      is incorrect. That compositional slot should be [different character]
      with the following canon appearance: [absolute identifiers].

  hero_shot_default:
    frequency: "structural — affects most prompts that don't actively prevent it"
    description: "Model defaults to characters facing camera in symmetrical posed lineup"
    triggers:
      - "prompts where CHARACTERS PRESENT block is longer than SCENE ACTION"
      - "prompts that describe what each character looks like more than what each character is doing"
    prevention_rules:
      - "[THE MOMENT] block is the longest block in every prompt"
      - "Cast bodies described in motion or held in moment, not static positions"
      - "Verb-driven action is the dominant signal"

  text_in_image:
    frequency: "intermittent"
    description: "Model adds Latin/decorative pseudo-text to parchment, banners, or backgrounds"
    prevention_rules:
      - "Negative prompt explicitly excludes: readable text, Dutch text, English text, Latin, Lorem Ipsum, fake script, labels, name tags, watermark"

  parchment_creep:
    frequency: "occasional after format pivot"
    description: "Model adds aged-paper texture, decorative border, or vignette inside the right-page portrait"
    cause: "model interprets 'fantasy book' style as needing parchment treatment"
    prevention_rules:
      - "Explicit instruction in every prompt: 'Do NOT generate parchment, decorative borders, or any left-page elements — only the right-page scene illustration as a single A4 portrait image. The portrait fills the entire canvas with the scene only. The scene runs full-bleed to all four edges.'"

regenerate_discipline:
  description: |
    Every regenerate prompt must restate the four format invariants verbatim,
    no matter how surgical the fix. Conversation memory is unreliable for
    format constraints — the most recent specific directive (e.g., a new
    camera angle) wins over implicit format memory.
  template_required_blocks:
    - "FORMAT INVARIANTS (must hold) — list all four"
    - "CORRECTION — what specifically needs to change from previous generation"
    - "KEEP from the previous generation — explicit list of what is correct and must not change"
    - "Cast lockdown — for any character involved in the correction"
    - "Negative prompt — including specific anti-failure clauses for this regenerate"

reference_attachment_strategy:
  description: "Per-spread rules for which references attach to which prompts"
  rules:
    always_attach: ["hero character lineup reference"]
    attach_when_villain_present: ["villain reference sheet"]
    attach_for_world_continuity: ["spread 1 (world map)"]
    attach_for_style_continuity: ["the most recently approved spread in the chapter"]
    parchment_template:
      attach: false
      reason: "parchment is composed in HTML post-production, never in AI generation"

conversation_strategy:
  description: "When to use new conversations vs continued conversations for character continuity"
  combat_heavy_chapters:
    rule: "new conversation per chapter"
    chapters: [4, 5, 6, 7, 8, 9]
    rationale: "character identity drift accumulates in long conversations under multi-character action load"
  quiet_chapters:
    rule: "continued conversation acceptable"
    chapters: [1, 2, 3, 10]
    rationale: "single-focus or two-focus compositions don't stress the continuity buffer"
  api_vs_chatgpt_note: |
    The same-conversation continuity that worked in ChatGPT testing is implicit
    — the model retained character details from earlier in the chat. The
    OpenAI Images API does not offer this. The substitute is robust
    reference-image attachment plus strict prompt-level character locking
    (the character identity sheet handles this). Test the reference-image
    attachment reliability across separate API calls before committing
    to the continued-conversation pattern.
